[package]
name = "media-search"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
duckdb = { version = "1.10506.0", features = ["bundled", "chrono", "serde_json"] }
encoding_rs = "0.8.42"
flate2 = "1.1.10"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
imagesize = "0.15.0"
infer = "0.22.0"
ipnet = { version = "2.12.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
walkdir = "2.5.0"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
